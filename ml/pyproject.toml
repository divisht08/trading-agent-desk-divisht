[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskml"
version = "0.2.0"
description = "Signals, features, ML model, backtester and Claude decision desk for Agent Desk"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "joblib>=1.4", "anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["deskml*"]

[tool.setuptools.package-data]
"deskml.agents" = ["prompts/*.md"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-desk-backend"
version = "0.2.0"
description = "Agent Desk API, trading engine, Kite gateway and scheduler"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "kiteconnect==5.2.2", "apscheduler>=3.10,<4",
  "httpx>=0.27", "pandas>=2.2", "numpy>=1.26", "mcp>=1.9,<2", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

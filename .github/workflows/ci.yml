name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ml pytest
      - run: cd ml && python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ml -e "backend[dev]"
      - run: cd backend && python -m pytest -q

  backend-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ml -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend
      - name: Check the Windows start script parses
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\start-windows.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs; exit 1 }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint && npm test && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [ml, backend, backend-windows, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-desk:ci .
